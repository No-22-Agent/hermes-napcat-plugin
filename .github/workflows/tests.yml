name: tests

# The plugin imports hermes-agent's `gateway.*` API directly, so every run
# clones NousResearch/hermes-agent at main HEAD — the API the plugin targets
# (README: "较新 main 构建").  A hermes-agent change can therefore break this
# CI without any change here; that is the early warning this job exists for.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Floor and ceiling of hermes-agent's requires-python (>=3.11,<3.15).
        python-version: ["3.11", "3.14"]
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Checkout hermes-agent (target API, main HEAD)
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          path: hermes-agent

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        # Minimum set the tests need (tests/conftest.py): aiohttp is the
        # adapter transport, ruamel.yaml/pyyaml back config parsing, and
        # hermes-agent itself is imported from the checkout, not installed.
        run: |
          python -m pip install --upgrade pip
          python -m pip install aiohttp ruamel.yaml pyyaml pytest

      - name: Run tests
        env:
          HERMES_AGENT_ROOT: ${{ github.workspace }}/hermes-agent
        run: python -m pytest tests/ -q
