name: napcat
label: NapCat (QQ)
kind: platform
version: 1.0.0
description: >
  NapCat / OneBot 11 (QQ) gateway adapter for Hermes Agent. Runs a
  reverse-WebSocket server that NapCat dials into (Universal role: API +
  events over one full-duplex connection) and relays messages between QQ
  groups/DMs and the Hermes agent. Ships the generic `napcat_call` tool
  (any OneBot 11 action) and the `napcat` operating skill. Inbound rich
  media is surfaced as inline markers the agent resolves on demand via
  get_image/get_record/get_file; outbound Hermes-local files are streamed
  to NapCat with upload_file_stream (NapCat v4.8.115+).
author: Nous Research community
requires_env:
  - name: NAPCAT_TOKEN
    description: "Shared secret authenticating NapCat's reverse-WS dial-in (Authorization: Bearer or ?access_token=) — must match the token configured on the NapCat WebSocket-client item"
    prompt: "NapCat access token"
    password: true
optional_env:
  - name: NAPCAT_ENABLED
    description: "Legacy force-enable switch — with the token readable from config.yaml or .env this is no longer needed (a token-less adapter would only retry-loop); kept for compatibility"
    prompt: "Force enable without token? (true/false)"
    password: false
  - name: NAPCAT_HOST
    description: "Reverse-WebSocket bind host (default 0.0.0.0)"
    prompt: "WS bind host"
    password: false
  - name: NAPCAT_PORT
    description: "Reverse-WebSocket listen port NapCat dials into (default 8646)"
    prompt: "Napcat reverse WS port"
    password: false
  - name: NAPCAT_PATH
    description: "Reverse-WebSocket path (default /napcat/ws)"
    prompt: "WS path"
    password: false
  - name: NAPCAT_HTTP_URL
    description: "Base URL of NapCat's OneBot HTTP API (e.g. http://127.0.0.1:3000) — enables standalone / cron delivery without the gateway process"
    prompt: "NapCat HTTP API base URL (optional)"
    password: false
  - name: NAPCAT_ALLOWED_USERS
    description: "Comma-separated QQ numbers allowed to DM the bot and to address it in groups at the gateway level (empty = open to everyone; adapter-level group settings: NAPCAT_GROUP_ALLOWED_USERS / NAPCAT_ALLOWED_GROUPS)"
    prompt: "Allowed users (comma-separated)"
    password: false
  - name: NAPCAT_GROUP_ALLOWED_USERS
    description: "Comma-separated QQ numbers allowed to talk to the bot in groups (empty = open)"
    prompt: "Allowed group users (comma-separated)"
    password: false
  - name: NAPCAT_ALLOWED_GROUPS
    description: "Group IDs whose members may all interact with the bot, comma-separated; * means any group. Empty = no group restriction"
    prompt: "Allowed groups (comma-separated)"
    password: false
  - name: NAPCAT_ALLOW_ALL_USERS
    description: "Skip all adapter allowlists (also skips the gateway-level user gate)"
    prompt: "Allow all users? (true/false)"
    password: false
  - name: NAPCAT_HOME_CHANNEL
    description: "Chat ID for cron / notification delivery (a QQ number or group:<group_id>)"
    prompt: "Home channel (optional)"
    password: false
